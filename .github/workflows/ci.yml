name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-build:
    name: Client lint and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      - run: npm run lint
        working-directory: client

      - run: npm run build
        working-directory: client
        env:
          VITE_API_BASE_URL: http://localhost:5000/api/v1

  server-tests:
    name: Server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: development
      MONGO_URI: mongodb://127.0.0.1:27017/flowforge_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: flowforge-ci-test-secret-32-characters-minimum
      GITHUB_WEBHOOK_SECRET: flowforge-ci-webhook-secret-32-characters-minimum
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - name: Start API and check health endpoint
        run: npm run smoke
        working-directory: server

      - run: npm test -- --runInBand --forceExit
        working-directory: server
