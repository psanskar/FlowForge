name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-build:
    name: Client lint and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      - run: npm run lint
        working-directory: client

      - run: npm run build
        working-directory: client
        env:
          VITE_API_BASE_URL: http://localhost:5000/api/v1

  client-e2e:
    name: Browser project creation journey
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.0.30
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      E2E_MONGO_URI: mongodb://127.0.0.1:27017/flowforge_browser_test
      E2E_REDIS_URL: redis://127.0.0.1:6379
      E2E_JWT_SECRET: flowforge-browser-test-secret-32-characters-minimum
      E2E_GITHUB_WEBHOOK_SECRET: flowforge-browser-webhook-secret-32-characters-minimum
      CLIENT_URL: http://127.0.0.1:5175
      VITE_API_BASE_URL: http://127.0.0.1:5500/api/v1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - run: npm ci
        working-directory: server

      - run: npm ci
        working-directory: client

      - run: npx playwright install --with-deps chromium
        working-directory: client

      - run: npm run test:e2e
        working-directory: client

  server-tests:
    name: Server tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: development
      MONGO_URI: mongodb://127.0.0.1:27017/flowforge_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: flowforge-ci-test-secret-32-characters-minimum
      GITHUB_WEBHOOK_SECRET: flowforge-ci-webhook-secret-32-characters-minimum
      OPERATIONS_API_KEY: flowforge-ci-operations-key-32-characters-minimum
    steps:
      - uses: actions/checkout@v7

      - name: Start transactional MongoDB replica set
        run: |
          docker run -d --name flowforge-test-mongo -p 27017:27017 mongo:8.0.30 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec flowforge-test-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then
              break
            fi
            sleep 1
          done
          docker exec flowforge-test-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec flowforge-test-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB replica set did not become primary" >&2
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - name: Start API and check health endpoint
        run: npm run smoke
        working-directory: server

      - run: npm test -- --forceExit
        working-directory: server
