name: flowforge-production

services:
  api:
    build: ./server
    restart: unless-stopped
    environment: &server-environment
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI to the managed MongoDB connection string}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the managed Redis connection string}
      JWT_SECRET: ${JWT_SECRET:?Set a unique production JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set the GitHub webhook secret}
      CLIENT_URL: https://${DOMAIN:?Set DOMAIN to the public hostname}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  github-worker:
    build: ./server
    restart: unless-stopped
    environment: *server-environment
    command: ["npm", "run", "worker:github"]

  health-worker:
    build: ./server
    restart: unless-stopped
    environment: *server-environment
    command: ["npm", "run", "worker:health"]

  health-scheduler:
    build: ./server
    restart: unless-stopped
    environment: *server-environment
    command: ["npm", "run", "scheduler:health"]

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: https://${DOMAIN:?Set DOMAIN to the public hostname}/api/v1
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
