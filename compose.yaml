name: flowforge

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/flowforge
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  github-worker:
    build:
      context: ./server
    command: ["node", "src/workers/githubWebhook.worker.js"]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/flowforge
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  health-snapshot-worker:
    build:
      context: ./server
    command: ["node", "src/workers/healthSnapshot.worker.js"]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/flowforge
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  health-snapshot-dispatch-worker:
    build:
      context: ./server
    command: ["node", "src/workers/healthSnapshotDispatch.worker.js"]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/flowforge
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  health-snapshot-scheduler:
    build:
      context: ./server
    command: ["node", "src/schedulers/healthSnapshot.scheduler.runner.js"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-5173}:80"

volumes:
  mongo_data:
  redis_data: